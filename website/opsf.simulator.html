<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>OSPF Simulator</title>
        <link rel="icon" href="gambar/logo.png">
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <header class="header">
            <h1>OSPF Simulator</h1>
        </header>

        <div>
            <main>
                <section class="kotak">
                    <section class="kotakDalam">

                    <section class="container-diagram">
                        <section class="topologi-canvas">
                            <!-- WAJIB ADA TAG <svg> AGAR GARIS & LINGKARAN ROUTER DIGAMBAR OLEH BROWSER -->
                            <svg id="ospf-topology" viewBox="0 0 1050 430">
                                    <defs>
                                        <pattern id="ospf-grid" width="35" height="35" patternUnits="userSpaceOnUse">
                                            <path class="grid-line" d="M 35 0 L 0 0 0 35" />
                                        </pattern>
                                    </defs>
                                
                                    <!-- Latar Grid Kanvas -->
                                    <rect class="canvas-bg" width="1050" height="430" />
                                
                                    <!-- LAYER 1: DAFTAR 14 KABEL / LINK (EDGES) -->
                                    <g id="edges-layer">
                                        <!-- Link 0: R0 <-> R1 (10 Mbps, Cost = 10) -->
                                        <a href="#toggle-edge-0" id="edge-0" class="edge" data-id="0" data-u="0" data-v="1" data-bw="10" data-cost="10">
                                            <line class="edge-hit" x1="65" y1="230" x2="225" y2="75" />
                                            <line class="edge-line" x1="65" y1="230" x2="225" y2="75" />
                                            <rect class="edge-badge" x="86" y="140.5" width="118" height="24" rx="6" />
                                            <text class="edge-label" x="145" y="156.5">10 Mbps, Cost = 10</text>
                                        </a>
                                        <!-- Link 1: R0 <-> R2 (50 Mbps, Cost = 2) -->
                                        <a href="#toggle-edge-1" id="edge-1" class="edge is-path" data-id="1" data-u="0" data-v="2" data-bw="50" data-cost="2">
                                            <line class="edge-hit" x1="65" y1="230" x2="225" y2="365" />
                                            <line class="edge-line" x1="65" y1="230" x2="225" y2="365" />
                                            <rect class="edge-badge" x="86" y="285.5" width="118" height="24" rx="6" />
                                            <text class="edge-label" x="145" y="301.5">50 Mbps, Cost = 2</text>
                                        </a>
                                        <!-- Link 2: R1 <-> R2 (25 Mbps, Cost = 4) -->
                                        <a href="#toggle-edge-2" id="edge-2" class="edge is-path" data-id="2" data-u="1" data-v="2" data-bw="25" data-cost="4">
                                            <line class="edge-hit" x1="225" y1="75" x2="225" y2="365" />
                                            <line class="edge-line" x1="225" y1="75" x2="225" y2="365" />
                                            <rect class="edge-badge" x="166" y="208" width="118" height="24" rx="6" />
                                            <text class="edge-label" x="225" y="224">25 Mbps, Cost = 4</text>
                                        </a>
                                        <!-- Link 3: R1 <-> R3 (50 Mbps, Cost = 2) -->
                                        <a href="#toggle-edge-3" id="edge-3" class="edge is-path" data-id="3" data-u="1" data-v="3" data-bw="50" data-cost="2">
                                            <line class="edge-hit" x1="225" y1="75" x2="415" y2="230" />
                                            <line class="edge-line" x1="225" y1="75" x2="415" y2="230" />
                                            <rect class="edge-badge" x="261" y="140.5" width="118" height="24" rx="6" />
                                            <text class="edge-label" x="320" y="156.5">50 Mbps, Cost = 2</text>
                                        </a>
                                        <!-- Link 4: R2 <-> R3 (10 Mbps, Cost = 10) -->
                                        <a href="#toggle-edge-4" id="edge-4" class="edge" data-id="4" data-u="2" data-v="3" data-bw="10" data-cost="10">
                                            <line class="edge-hit" x1="225" y1="365" x2="415" y2="230" />
                                            <line class="edge-line" x1="225" y1="365" x2="415" y2="230" />
                                            <rect class="edge-badge" x="261" y="285.5" width="118" height="24" rx="6" />
                                            <text class="edge-label" x="320" y="301.5">10 Mbps, Cost = 10</text>
                                        </a>
                                        <!-- Link 5: R3 <-> R4 (100 Mbps, Cost = 1) -->
                                        <a href="#toggle-edge-5" id="edge-5" class="edge is-path" data-id="5" data-u="3" data-v="4" data-bw="100" data-cost="1">
                                            <line class="edge-hit" x1="415" y1="230" x2="600" y2="80" />
                                            <line class="edge-line" x1="415" y1="230" x2="600" y2="80" />
                                            <rect class="edge-badge" x="448.5" y="143" width="118" height="24" rx="6" />
                                            <text class="edge-label" x="507.5" y="159">100 Mbps, Cost = 1</text>
                                        </a>
                                        <!-- Link 6: R3 <-> R5 (25 Mbps, Cost = 4) -->
                                        <a href="#toggle-edge-6" id="edge-6" class="edge" data-id="6" data-u="3" data-v="5" data-bw="25" data-cost="4">
                                            <line class="edge-hit" x1="415" y1="230" x2="600" y2="365" />
                                            <line class="edge-line" x1="415" y1="230" x2="600" y2="365" />
                                            <rect class="edge-badge" x="448.5" y="285.5" width="118" height="24" rx="6" />
                                            <text class="edge-label" x="507.5" y="301.5">25 Mbps, Cost = 4</text>
                                        </a>
                                        <!-- Link 7: R4 <-> R6 (100 Mbps, Cost = 1) -->
                                        <a href="#toggle-edge-7" id="edge-7" class="edge is-path" data-id="7" data-u="4" data-v="6" data-bw="100" data-cost="1">
                                            <line class="edge-hit" x1="600" y1="80" x2="785" y2="80" />
                                            <line class="edge-line" x1="600" y1="80" x2="785" y2="80" />
                                            <rect class="edge-badge" x="633.5" y="68" width="118" height="24" rx="6" />
                                            <text class="edge-label" x="692.5" y="84">100 Mbps, Cost = 1</text>
                                        </a>
                                        <!-- Link 8: R5 <-> R6 (25 Mbps, Cost = 4) -->
                                        <a href="#toggle-edge-8" id="edge-8" class="edge" data-id="8" data-u="5" data-v="6" data-bw="25" data-cost="4">
                                            <line class="edge-hit" x1="600" y1="365" x2="785" y2="80" />
                                            <line class="edge-line" x1="600" y1="365" x2="785" y2="80" />
                                            <rect class="edge-badge" x="633.5" y="210.5" width="118" height="24" rx="6" />
                                            <text class="edge-label" x="692.5" y="226.5">25 Mbps, Cost = 4</text>
                                        </a>
                                        <!-- Link 9: R5 <-> R7 (50 Mbps, Cost = 2) -->
                                        <a href="#toggle-edge-9" id="edge-9" class="edge" data-id="9" data-u="5" data-v="7" data-bw="50" data-cost="2">
                                            <line class="edge-hit" x1="600" y1="365" x2="785" y2="365" />
                                            <line class="edge-line" x1="600" y1="365" x2="785" y2="365" />
                                            <rect class="edge-badge" x="633.5" y="353" width="118" height="24" rx="6" />
                                            <text class="edge-label" x="692.5" y="369">50 Mbps, Cost = 2</text>
                                        </a>
                                        <!-- Link 10: R6 <-> R8 (50 Mbps, Cost = 2) -->
                                        <a href="#toggle-edge-10" id="edge-10" class="edge is-path" data-id="10" data-u="6" data-v="8" data-bw="50" data-cost="2">
                                            <line class="edge-hit" x1="785" y1="80" x2="975" y2="80" />
                                            <line class="edge-line" x1="785" y1="80" x2="975" y2="80" />
                                            <rect class="edge-badge" x="821" y="68" width="118" height="24" rx="6" />
                                            <text class="edge-label" x="880" y="84">50 Mbps, Cost = 2</text>
                                        </a>
                                        <!-- Link 11: R7 <-> R8 (25 Mbps, Cost = 4) -->
                                        <a href="#toggle-edge-11" id="edge-11" class="edge" data-id="11" data-u="7" data-v="8" data-bw="25" data-cost="4">
                                            <line class="edge-hit" x1="785" y1="365" x2="975" y2="80" />
                                            <line class="edge-line" x1="785" y1="365" x2="975" y2="80" />
                                            <rect class="edge-badge" x="821" y="210.5" width="118" height="24" rx="6" />
                                            <text class="edge-label" x="880" y="226.5">25 Mbps, Cost = 4</text>
                                        </a>
                                        <!-- Link 12: R7 <-> R9 (20 Mbps, Cost = 5) -->
                                        <a href="#toggle-edge-12" id="edge-12" class="edge" data-id="12" data-u="7" data-v="9" data-bw="20" data-cost="5">
                                            <line class="edge-hit" x1="785" y1="365" x2="975" y2="365" />
                                            <line class="edge-line" x1="785" y1="365" x2="975" y2="365" />
                                            <rect class="edge-badge" x="821" y="353" width="118" height="24" rx="6" />
                                            <text class="edge-label" x="880" y="369">20 Mbps, Cost = 5</text>
                                        </a>
                                        <!-- Link 13: R8 <-> R9 (100 Mbps, Cost = 1) -->
                                        <a href="#toggle-edge-13" id="edge-13" class="edge is-path" data-id="13" data-u="8" data-v="9" data-bw="100" data-cost="1">
                                            <line class="edge-hit" x1="975" y1="80" x2="975" y2="365" />
                                            <line class="edge-line" x1="975" y1="80" x2="975" y2="365" />
                                            <rect class="edge-badge" x="916" y="250.5" width="118" height="24" rx="6" />
                                            <text class="edge-label" x="975" y="266.5">100 Mbps, Cost = 1</text>
                                        </a>
                                    </g>
                                
                                    <!-- LAYER 2: DAFTAR 10 ROUTER (NODES R0 - R9) -->
                                    <g id="nodes-layer">
                                        <!-- Router R0 -->
                                        <a href="#toggle-node-0" id="node-0" class="node is-path is-source" data-id="0" data-label="R0">
                                            <circle class="node-circle" cx="65" cy="230" r="28" />
                                            <text class="node-name" x="65" y="235">R0</text>
                                            <text class="node-cost" id="cost-0" x="65" y="276">ASAL • Cost: 0</text>
                                        </a>
                                        <!-- Router R1 -->
                                        <a href="#toggle-node-1" id="node-1" class="node is-path" data-id="1" data-label="R1">
                                            <circle class="node-circle" cx="225" cy="75" r="28" />
                                            <text class="node-name" x="225" y="80">R1</text>
                                            <text class="node-cost" id="cost-1" x="225" y="35">Cost: 6</text>
                                        </a>
                                        <!-- Router R2 -->
                                        <a href="#toggle-node-2" id="node-2" class="node is-path" data-id="2" data-label="R2">
                                            <circle class="node-circle" cx="225" cy="365" r="28" />
                                            <text class="node-name" x="225" y="370">R2</text>
                                            <text class="node-cost" id="cost-2" x="225" y="411">Cost: 2</text>
                                        </a>
                                        <!-- Router R3 -->
                                        <a href="#toggle-node-3" id="node-3" class="node is-path" data-id="3" data-label="R3">
                                            <circle class="node-circle" cx="415" cy="230" r="28" />
                                            <text class="node-name" x="415" y="235">R3</text>
                                            <text class="node-cost" id="cost-3" x="415" y="276">Cost: 8</text>
                                        </a>
                                        <!-- Router R4 -->
                                        <a href="#toggle-node-4" id="node-4" class="node is-path" data-id="4" data-label="R4">
                                            <circle class="node-circle" cx="600" cy="80" r="28" />
                                            <text class="node-name" x="600" y="85">R4</text>
                                            <text class="node-cost" id="cost-4" x="600" y="40">Cost: 9</text>
                                        </a>
                                        <!-- Router R5 -->
                                        <a href="#toggle-node-5" id="node-5" class="node" data-id="5" data-label="R5">
                                            <circle class="node-circle" cx="600" cy="365" r="28" />
                                            <text class="node-name" x="600" y="370">R5</text>
                                            <text class="node-cost" id="cost-5" x="600" y="411">Cost: 12</text>
                                        </a>
                                        <!-- Router R6 -->
                                        <a href="#toggle-node-6" id="node-6" class="node is-path" data-id="6" data-label="R6">
                                            <circle class="node-circle" cx="785" cy="80" r="28" />
                                            <text class="node-name" x="785" y="85">R6</text>
                                            <text class="node-cost" id="cost-6" x="785" y="40">Cost: 10</text>
                                        </a>
                                        <!-- Router R7 -->
                                        <a href="#toggle-node-7" id="node-7" class="node" data-id="7" data-label="R7">
                                            <circle class="node-circle" cx="785" cy="365" r="28" />
                                            <text class="node-name" x="785" y="370">R7</text>
                                            <text class="node-cost" id="cost-7" x="785" y="411">Cost: 14</text>
                                        </a>
                                        <!-- Router R8 -->
                                        <a href="#toggle-node-8" id="node-8" class="node is-path" data-id="8" data-label="R8">
                                            <circle class="node-circle" cx="975" cy="80" r="28" />
                                            <text class="node-name" x="975" y="85">R8</text>
                                            <text class="node-cost" id="cost-8" x="975" y="40">Cost: 12</text>
                                        </a>
                                        <!-- Router R9 -->
                                        <a href="#toggle-node-9" id="node-9" class="node is-path is-dest" data-id="9" data-label="R9">
                                            <circle class="node-circle" cx="975" cy="365" r="28" />
                                            <text class="node-name" x="975" y="370">R9</text>
                                            <text class="node-cost" id="cost-9" x="975" y="411">TUJUAN • Cost: 13</text>
                                        </a>
                                    </g>
                                </svg>
                            </section>
                            <section class="container-rute-router">
                                Rute Router
                                <section class="container-rute-router-tombol">
                                    <button> R0 </button>
                                    <button> R1 </button>
                                    <button> R2 </button>
                                    <button> R3 </button>
                                    <button> R4 </button>
                                </section>
                                <section class="container-rute-router-tombol">
                                    <button> R5 </button>
                                    <button> R6 </button>
                                    <button> R7 </button>
                                    <button> R8 </button>
                                    <button> R9 </button>
                                </section>
                            </section>
                        </section>

                        <section class="container-pilih-router">
                            <section class="container-tombol-awal">
                                <label for="tombol">Awal</label>
                                <select id="tombol" class="tombol">
                                    <option value="R0">R0</option>
                                    <option value="R1">R1</option>
                                    <option value="R2">R2</option>
                                    <option value="R3">R3</option>
                                    <option value="R4">R4</option>
                                    <option value="R5">R5</option>
                                    <option value="R6">R6</option>
                                    <option value="R7">R7</option>
                                    <option value="R8">R8</option>
                                    <option value="R9">R9</option>
                                </select>
                            </section>

                            <section class="container-tombol-akhir">
                                <label for="tombol-akhir">Akhir</label>
                                <select id="tombol-akhir" class="tombol">
                                    <option value="R0">R0</option>
                                    <option value="R1">R1</option>
                                    <option value="R2">R2</option>
                                    <option value="R3">R3</option>
                                    <option value="R4">R4</option>
                                    <option value="R5">R5</option>
                                    <option value="R6">R6</option>
                                    <option value="R7">R7</option>
                                    <option value="R8">R8</option>
                                    <option value="R9">R9</option>
                                </select>
                            </section>
                        </section>
                </section>
            </main>
        </div>

        <!-- Memanggil logika OSPF Dijkstra -->
        <script src="script.js"></script>
    </body>
</html>
